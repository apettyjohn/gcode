services:
  gcode-db:
    image: agnohq/pgvector:18
    container_name: gcode-db
    environment:
      - POSTGRES_USER=${DB_USER:-ai}
      - POSTGRES_PASSWORD=${DB_PASS:-ai}
      - POSTGRES_DB=${DB_DATABASE:-ai}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - agent-network

  gcode-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-gcode}:${IMAGE_TAG:-latest}
    container_name: gcode-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      # Hot-reload: mount source code (DISABLED)
      # - .:/app
      # Persistent workspace: where Gcode clones repos & creates projects
      # This volume is user-scoped and survives container restarts
      - workspace:/workspace
    environment:
      - RUNTIME_ENV=dev
      - APP_ENV=development
      - AGNO_DEBUG=True
      - PYTHONPATH=/app
      # Database
      - DB_HOST=gcode-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai}
      - DB_PASS=${DB_PASS:-ai}
      - DB_DATABASE=${DB_DATABASE:-ai}
      - WAIT_FOR_DB=True
      - PRINT_ENV_ON_LOAD=False
      # API keys
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Telegram
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      # Workspace config
      - WORKSPACE_DIR=/workspace
    depends_on:
      - gcode-db
    networks:
      - agent-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agent-network:
    external: true

volumes:
  pgdata:
  workspace:
